<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generatore schede guasto</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/img/logo_egp.png" alt="Logo" />
      <div class="title">
        <h1>Generatore schede guasto</h1>
        <div class="subtitle">Reperibilita • UT Feltre • OU Quero</div>
      </div>
    </div>
    <div class="toolbar">
      <div class="toolbar-group">
        <span class="small-muted">Versione</span>
        <span class="badge" id="versionLabel">v5.4.0</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">Dati intervento</div>
      </div>
      <div class="meta-grid">
        <label class="full">
          <span>Impianto</span>
          <select id="plantSelect">
            <option value="">— seleziona impianto —</option>
          </select>
        </label>
        <label>
          <span>Data anomalia</span>
          <input type="date" id="dateInput" />
        </label>
        <label>
          <span>Orario anomalia</span>
          <input type="time" id="timeInput" />
        </label>
        <label class="full">
          <span>Operatore</span>
          <input type="text" id="operatorInput" placeholder="Nome e cognome o sigla" />
        </label>
        <label class="full">
          <span>Zona (selezione multipla)</span>
          <div class="chips" id="zoneChips"></div>
        </label>
        <label class="full">
          <span>Anomalia (scelta singola)</span>
          <div class="chips" id="anomalyChips"></div>
        </label>
        <label class="full">
          <span>Descrizione anomalia</span>
          <textarea id="descInput" class="note" placeholder="Descrivi l'anomalia riscontrata..."></textarea>
        </label>
        <label class="full">
          <span>Operazioni effettuate</span>
          <textarea id="opsInput" class="note" placeholder="Indica le azioni svolte, controlli e risultati..."></textarea>
        </label>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">Allegati foto</div>
        <div class="panel-actions small-muted">Massimo 3 foto</div>
      </div>
      <div class="sections">
        <div class="photo-grid">
          <div class="photo-card" data-photo="0">
            <div class="photo-preview">
              <img alt="Foto 1" data-photo-img />
            </div>
            <div class="photo-meta" data-photo-name>Foto 1: nessun file</div>
            <div class="actions-inline">
              <input type="file" accept="image/*" data-photo-input />
              <button class="btn" type="button" data-photo-pick>Aggiungi foto</button>
              <button class="icon-btn danger" type="button" data-photo-remove>Rimuovi</button>
            </div>
          </div>
          <div class="photo-card" data-photo="1">
            <div class="photo-preview">
              <img alt="Foto 2" data-photo-img />
            </div>
            <div class="photo-meta" data-photo-name>Foto 2: nessun file</div>
            <div class="actions-inline">
              <input type="file" accept="image/*" data-photo-input />
              <button class="btn" type="button" data-photo-pick>Aggiungi foto</button>
              <button class="icon-btn danger" type="button" data-photo-remove>Rimuovi</button>
            </div>
          </div>
          <div class="photo-card" data-photo="2">
            <div class="photo-preview">
              <img alt="Foto 3" data-photo-img />
            </div>
            <div class="photo-meta" data-photo-name>Foto 3: nessun file</div>
            <div class="actions-inline">
              <input type="file" accept="image/*" data-photo-input />
              <button class="btn" type="button" data-photo-pick>Aggiungi foto</button>
              <button class="icon-btn danger" type="button" data-photo-remove>Rimuovi</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">Anteprima testo</div>
        <div class="panel-actions">
          <span class="status" id="statusMsg"></span>
        </div>
      </div>
      <div class="sections">
        <textarea id="previewOutput" class="note preview-box" readonly></textarea>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div class="panel-title">Azioni</div>
      </div>
      <div class="sections actions-bar">
        <button class="btn btn-primary" id="copyBtn" type="button">Copia</button>
        <button class="btn" id="printBtn" type="button">Stampa</button>
        <button class="btn" id="downloadBtn" type="button">Download PDF</button>
        <button class="btn" id="mailBtn" type="button">Mail</button>
        <button class="btn btn-danger" id="resetBtn" type="button">Nuovo report</button>
      </div>
    </section>
  </main>

  <footer class="app-footer">Generatore report reperibilita • <span id="versionFooter">v5.4.0</span></footer>

  <script src="lib/jspdf.umd.min.js"></script>
  <script src="lib/jspdf.plugin.autotable.min.js"></script>
  <script src="js/shareReport.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
