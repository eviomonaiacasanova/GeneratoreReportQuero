<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Generatore schede guasti – UT Feltre / OU Quero
       Versione: v5.3.5 (PDF senza logo, testo grande e leggibile su mezza pagina) -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Generatore report v5.3.5</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'none'">
  <style>
    :root { --bg:#0b0c10; --panel:#121318; --border:#23242a; --muted:#aeb3bb; --text:#e6e6e6; --surface:#181a21; --accent:#4e8df5; --danger:#c0392b; --danger-border:#b23427; --gap:12px; --radius:10px; --shadow:0 10px 30px rgba(0,0,0,.35); }
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:900px;margin:24px auto;padding:0 16px 108px}
    h1.title{margin:0 0 18px;display:flex;align-items:center;justify-content:center;gap:14px;text-align:center}
    .logo{height:80px;object-fit:contain}
    .titlestack{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
    .titlestack .line1{font-size:1.4rem;font-weight:800}
    .titlestack .line2{font-size:1.05rem;color:var(--muted);margin-top:2px}
    form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--gap);background:var(--panel);padding:18px;border-radius:var(--radius);border:1px solid var(--border)}
    .field{display:flex;flex-direction:column;gap:6px} .full{grid-column:1 / -1} label,legend{font-weight:600;font-size:.95rem} .nota-legenda{color:var(--muted);font-size:.9rem;margin:2px 0 6px}
    select,input[type=date],input[type=time],input[type=text],textarea{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px}
    select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(78,141,245,.15)} textarea{min-height:110px;resize:vertical}
    .azioni{display:flex;gap:10px;flex-wrap:wrap;align-items:center} .btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;cursor:pointer}
    .btn--primario{background:var(--accent);border-color:var(--accent);color:#fff} .btn--pericolo{background:var(--danger);border-color:var(--danger-border);color:#fff} .btn[disabled]{opacity:.6;cursor:not-allowed}
    .chips{display:flex;flex-wrap:wrap;gap:10px} .chip{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:10px 14px;font-weight:600;cursor:pointer;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
    .chip[aria-pressed=true],.chip[aria-checked=true]{background:#27447c;border-color:var(--accent);box-shadow:0 0 0 3px rgba(78,141,245,.18) inset}
    #anomaliaChips{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .report-area{width:100%;min-height:150px;user-select:text;font-family:ui-monospace,Menlo,Consolas,monospace}
    .muted{color:var(--muted);font-size:.9rem} .invalid{border-color:#d15757!important;box-shadow:0 0 0 3px rgba(209,87,87,.15)!important}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--gap)} .foto-card{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:10px}
    .foto-preview{display:block;width:100%;aspect-ratio:4/3;background:#0f1117;border:1px dashed #3a3d44;border-radius:8px;object-fit:contain;visibility:hidden}
    .foto-actions{display:flex;gap:8px} input[type=file].hidden{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
    #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#1e232b;color:#fff;padding:12px 14px;border-radius:10px;border:1px solid #333a44;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .24s,transform .24s;max-width:92vw;font-size:.95rem;z-index:9999}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    footer{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(18,19,24,0),rgba(18,19,24,.85) 20%,var(--panel) 55%)}
    .footer-inner{max-width:900px;margin:0 auto;padding:10px 16px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-size:.88rem;color:#d0d4db}
    .footer-inner .dot{opacity:.7;padding:0 8px} .badge{padding:3px 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:#dfe3ea;font-weight:700;font-size:.82rem}
    @media print{html,body{background:#fff;color:#000}.wrap{padding:0 0 8px} .azioni{display:none!important} .chip{border-color:#777;background:#fff;color:#000;box-shadow:none!important} footer{position:static;background:#fff;border-top:1px solid #888} .footer-inner{color:#000;justify-content:space-between} .badge{background:#fff;border-color:#888;color:#000} textarea.report-area{white-space:pre-wrap}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">
      <img class="logo" src="logo_egp.png" alt="Enel Green Power"/>
      <span class="titlestack"><span class="line1">Generatore schede guasti</span><span class="line2">UT Feltre - OU Quero</span></span>
    </h1>

    <form id="formReport" novalidate>
      <div class="field">
        <label for="impianto">Impianto</label>
        <select id="impianto" required>
          <option value="" disabled selected>— seleziona impianto —</option>
        </select>
      </div>

      <div class="field"><label for="data">Data anomalia</label><input type="date" id="data" /></div>
      <div class="field"><label for="ora">Orario anomalia</label><input type="time" id="ora" /></div>
      <div class="field"><label for="operatore">Operatore</label><input type="text" id="operatore" placeholder="Nome e cognome o sigla" /></div>

      <fieldset class="field full">
        <legend>Zona</legend><div class="nota-legenda">(clic per selezionare/deselezionare)</div>
        <div id="zoneChips" class="chips" role="group" aria-label="Selezione multipla zona">
          <button type="button" class="chip" data-value="GRUPPO 1" aria-pressed="false">GRUPPO 1</button>
          <button type="button" class="chip" data-value="GRUPPO 2" aria-pressed="false">GRUPPO 2</button>
          <button type="button" class="chip" data-value="SGRIGLIATORE" aria-pressed="false">SGRIGLIATORE</button>
          <button type="button" class="chip" data-value="ALTRO" aria-pressed="false">ALTRO</button>
        </div>
      </fieldset>

      <fieldset class="field full">
        <legend>Anomalia</legend><div class="nota-legenda">(clic per selezionare)</div>
        <div id="anomaliaChips" class="chips" role="radiogroup" aria-label="Tipo di anomalia">
          <button type="button" class="chip" role="radio" data-value="ALLARME" aria-checked="false">ALLARME</button>
          <button type="button" class="chip" role="radio" data-value="BLOCCO" aria-checked="false">BLOCCO</button>
          <button type="button" class="chip" role="radio" data-value="ALTRO" aria-checked="false">ALTRO</button>
        </div>
      </fieldset>

      <div class="field full"><label for="descrizione">Descrizione anomalia</label><textarea id="descrizione" placeholder="Descrivi l'anomalia riscontrata..."></textarea></div>
      <div class="field full"><label for="operazioni">Operazioni effettuate</label><textarea id="operazioni" placeholder="Indica le azioni svolte, controlli e risultati..."></textarea></div>

      <fieldset class="field full">
        <legend>Allegati foto</legend>
        <div class="nota-legenda">Fino a 3 immagini. L'anteprima compare sopra al pulsante. Ogni foto si può eliminare.</div>
        <div class="gallery">
          <div class="foto-card" data-slot="1">
            <img class="foto-preview" id="preview1" alt="Anteprima foto 1" />
            <div class="foto-actions">
              <button type="button" class="btn btn--primario" id="btnUpload1">Carica foto 1</button>
              <button type="button" class="btn btn--pericolo" id="btnDelete1" disabled>Elimina</button>
            </div>
            <input type="file" accept="image/*" id="file1" class="hidden" />
          </div>
          <div class="foto-card" data-slot="2">
            <img class="foto-preview" id="preview2" alt="Anteprima foto 2" />
            <div class="foto-actions">
              <button type="button" class="btn btn--primario" id="btnUpload2">Carica foto 2</button>
              <button type="button" class="btn btn--pericolo" id="btnDelete2" disabled>Elimina</button>
            </div>
            <input type="file" accept="image/*" id="file2" class="hidden" />
          </div>
          <div class="foto-card" data-slot="3">
            <img class="foto-preview" id="preview3" alt="Anteprima foto 3" />
            <div class="foto-actions">
              <button type="button" class="btn btn--primario" id="btnUpload3">Carica foto 3</button>
              <button type="button" class="btn btn--pericolo" id="btnDelete3" disabled>Elimina</button>
            </div>
            <input type="file" accept="image/*" id="file3" class="hidden" />
          </div>
        </div>
      </fieldset>

      <div class="field full"><label for="reportFinale">Report generato</label><textarea id="reportFinale" class="report-area" readonly aria-readonly="true" placeholder="Il report comparirà qui man mano che compili."></textarea></div>

      <div class="full azioni">
        <button type="button" id="btnCopy" class="btn btn--primario">COPIA</button>
        <button type="button" id="btnPrintPdf" class="btn">Stampa PDF</button>
        <button type="button" id="btnDownloadPdf" class="btn">Download PDF</button>
        <button type="button" id="btnReset" class="btn btn--pericolo" title="Svuota e riparti">Nuovo report</button>
        <span class="muted" id="copiedMsg" aria-live="polite"></span>
      </div>
    </form>
  </div>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <footer>
    <div class="footer-inner">
      <span class="badge" id="versionBadge">Generatore di report • v5.3.5</span>
      <span class="dot">•</span>
      <span class="muted">Uso interno Enel Green Power</span>
    </div>
  </footer>

  <script>
    const CONFIG = { VERSION:'v5.3.5', PLANTS:[ 'ALTANON','ANZU','ARCADE','BUSCHE DMV','BUSCHE SBARRAMENTO','CAERANO','CASTELVIERO','CROCE DEL GALLO','FONDERIA','PEDEROBBA','POMPE SONNA','PONTE PIETRA','PONTE SAN MARTINO','PRIULA','QUERO','SPEEDY','SPRESIANO','TAVARAN' ] };
    const MSG = { nothingToCopy:'Niente da copiare.', copied:'Copiato!', nothingToPrint:'Niente da stampare.', pdfError:'Errore durante la creazione del PDF.', popupBlocked:'Popup bloccato.' };

    const state = { images:{1:null,2:null,3:null} };
    const $=(s)=>document.querySelector(s); const $$=(s)=>Array.from(document.querySelectorAll(s));
    const debounce=(fn,d=200)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),d);};};

    // Toast
    let toastTimer=null; function showToast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2500); }

    // Helpers
    function nowDate(){ const d=new Date(); const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
    function nowTime(){ const d=new Date(); const hh=String(d.getHours()).padStart(2,'0'); const mm=String(d.getMinutes()).padStart(2,'0'); return `${hh}:${mm}`; }

    // Chips
    function selectedZones(){ return $$('#zoneChips .chip[aria-pressed="true"]').map(b=>b.dataset.value); }
    function selectedAnomaly(){ const on=$('#anomaliaChips .chip[aria-checked="true"]'); return on?on.dataset.value:''; }

    // Report
    function buildReport(){
      const plant=$('#impianto').value||'—'; const date=$('#data').value||'—'; const time=$('#ora').value||'—';
      const operator=($('#operatore').value||'').trim(); const zones=selectedZones(); const anomaly=selectedAnomaly()||'—';
      const desc=($('#descrizione').value||'').trim(); const ops=($('#operazioni').value||'').trim();
      const lines=[`IMPIANTO: ${plant}`,`DATA: ${date}`,`ORA: ${time}`,(operator?`OPERATORE: ${operator}`:'OPERATORE: —'),`ZONA: ${zones.length?zones.join(', '):'—'}`,`ANOMALIA: ${anomaly}`,'','DESCRIZIONE ANOMALIA:',(desc||'—'),'','OPERAZIONI EFFETTUATE:',(ops||'—')];
      $('#reportFinale').value = lines.join('\n'); updateActionState();
    }
    function updateActionState(){ const hasText=!!(($('#reportFinale').value||'').trim()); $('#btnCopy').disabled=!hasText; $('#btnPrintPdf').disabled=!hasText; $('#btnDownloadPdf').disabled=!hasText; }

    // Images
    function resetImageSlot(i){ const img=$('#preview'+i); img.removeAttribute('src'); img.style.visibility='hidden'; $('#btnDelete'+i).disabled=true; const f=$('#file'+i); if(f) f.value=''; state.images[i]=null; }
    function setImagePreview(i, dataUrl){ const img=$('#preview'+i); img.src=dataUrl; img.style.visibility='visible'; $('#btnDelete'+i).disabled=false; state.images[i]=dataUrl; }
    function bindImageSlot(i){
      const f=$('#file'+i), btnU=$('#btnUpload'+i), btnD=$('#btnDelete'+i), prev=$('#preview'+i);
      prev.style.visibility='hidden';
      btnU.addEventListener('click', ()=> f && f.click());
      f.addEventListener('change', ()=>{ const file=(f.files||[])[0]; if(!file) return; if(!file.type.startsWith('image/')) return; const reader=new FileReader(); reader.onload=e=>setImagePreview(i,e.target.result); reader.readAsDataURL(file); });
      btnD.addEventListener('click', ()=> resetImageSlot(i));
    }

    // PDF (no logo, larger text; page 1 top half text, bottom half first photo; page 2 two photos half page each)
    const A4W=1654, A4H=2339, MARGIN=100;
    function wrapText(ctx, text, maxW){ const words=(text||'').split(/\s+/); const lines=[]; let line=''; for(const w of words){ const test=line?line+' '+w:w; if(ctx.measureText(test).width<=maxW) line=test; else{ if(line) lines.push(line); line=w; } } if(line) lines.push(line); return lines; }

    async function drawHeader(ctx){
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,A4W,A4H);
      ctx.fillStyle='#000'; ctx.textAlign='center';
      ctx.font='bold 48px Segoe UI, Arial'; ctx.fillText('UT Feltre - OU Quero', A4W/2, MARGIN);
      ctx.font='600 32px Segoe UI, Arial'; ctx.fillText('Scheda Guasto', A4W/2, MARGIN+38);
      return MARGIN+76;
    }

    function drawLabelValue(ctx, label, value, x, y, maxW){
      ctx.font='bold 28px Segoe UI, Arial'; ctx.fillStyle='#222'; ctx.fillText(label, x, y);
      ctx.font='24px Segoe UI, Arial'; ctx.fillStyle='#000';
      const lines=wrapText(ctx, value||'—', maxW);
      let yy=y+30;
      for(const ln of lines){ ctx.fillText(ln, x, yy); yy+=28; }
      return yy+10;
    }

    async function renderFirstPage(text, firstImageUrl){
      const c=document.createElement('canvas'); c.width=A4W; c.height=A4H; const ctx=c.getContext('2d');
      let y = await drawHeader(ctx);
      const topAreaBottom = Math.round(A4H/2);
      const left=MARGIN, right=A4W-MARGIN, maxW=right-left;

      // Parse text to fields
      const lines=text.split('\n');
      const map={};
      let section='';
      for(const ln of lines){
        if(/^IMPIANTO:/.test(ln)) map.plant=ln.replace('IMPIANTO: ','').trim();
        else if(/^DATA:/.test(ln)) map.date=ln.replace('DATA: ','').trim();
        else if(/^ORA:/.test(ln)) map.time=ln.replace('ORA: ','').trim();
        else if(/^OPERATORE:/.test(ln)) map.operator=ln.replace('OPERATORE: ','').trim();
        else if(/^ZONA:/.test(ln)) map.zone=ln.replace('ZONA: ','').trim();
        else if(/^ANOMALIA:/.test(ln)) map.anomaly=ln.replace('ANOMALIA: ','').trim();
        else if(/^DESCRIZIONE ANOMALIA:/.test(ln)) section='desc';
        else if(/^OPERAZIONI EFFETTUATE:/.test(ln)) section='ops';
        else { if(section==='desc'){ map.desc=(map.desc||'')+(map.desc?'\n':'')+ln; } else if(section==='ops'){ map.ops=(map.ops||'')+(map.ops?'\n':'')+ln; } }
      }

      // Big readable text in top half
      y = drawLabelValue(ctx, 'Impianto', map.plant||'—', left, y, maxW);

      const rowTop = y;
      y = drawLabelValue(ctx, 'Data', map.date||'—', left, y, Math.floor(maxW/2)-20);
      const yAfterDate = y;
      const yOra = drawLabelValue(ctx, 'Ora', map.time||'—', left + Math.floor(maxW/2)+40, rowTop, Math.floor(maxW/2)-20);
      y = Math.max(yAfterDate, yOra);

      y = drawLabelValue(ctx, 'Operatore', map.operator||'—', left, y, maxW);
      y = drawLabelValue(ctx, 'Zona', map.zone||'—', left, y, maxW);
      y = drawLabelValue(ctx, 'Anomalia', map.anomaly||'—', left, y, maxW);

      ctx.font='bold 28px Segoe UI, Arial'; ctx.fillStyle='#222'; ctx.fillText('Descrizione anomalia', left, y+6);
      y+=36; ctx.font='24px Segoe UI, Arial'; ctx.fillStyle='#000';
      for(const ln of wrapText(ctx, map.desc||'—', maxW)){ if(y>topAreaBottom-20) break; ctx.fillText(ln,left,y); y+=30; }

      ctx.font='bold 28px Segoe UI, Arial'; ctx.fillStyle='#222'; ctx.fillText('Operazioni effettuate', left, y+24);
      y+=52; ctx.font='24px Segoe UI, Arial'; ctx.fillStyle='#000';
      for(const ln of wrapText(ctx, map.ops||'—', maxW)){ if(y>topAreaBottom-20) break; ctx.fillText(ln,left,y); y+=30; }

      // Bottom half: first image
      if(firstImageUrl){
        await new Promise((resolve,reject)=>{
          const img=new Image(); img.onload=()=>{
            const areaTop=topAreaBottom+20; const areaBottom=A4H-MARGIN; const areaH=areaBottom-areaTop; const areaW=A4W-MARGIN*2;
            const scale=Math.min(areaW/img.width, areaH/img.height); const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
            const x=Math.round((A4W - w)/2), yy=Math.round(areaTop + (areaH - h)/2);
            ctx.drawImage(img, x, yy, w, h); resolve();
          }; img.onerror=reject; img.src=firstImageUrl;
        });
      }
      return c;
    }

    async function renderSecondPage(remainingUrls){
      if(!remainingUrls.length) return null;
      const c=document.createElement('canvas'); c.width=A4W; c.height=A4H; const ctx=c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,A4W,A4H);
      ctx.fillStyle='#000'; ctx.textAlign='center'; ctx.font='600 28px Segoe UI, Arial'; ctx.fillText('Allegati fotografici', A4W/2, MARGIN);

      const areaTop=MARGIN+20, areaBottom=A4H-MARGIN; const totalH=areaBottom-areaTop; const slotH=(totalH-40)/2;
      let yCursor=areaTop;
      for(let i=0;i<Math.min(2, remainingUrls.length); i++){
        const url=remainingUrls[i];
        await new Promise((resolve,reject)=>{
          const img=new Image(); img.onload=()=>{
            const areaW=A4W-MARGIN*2; const scale=Math.min(areaW/img.width, slotH/img.height);
            const w=Math.round(img.width*scale), h=Math.round(img.height*scale); const x=Math.round((A4W - w)/2); const y=Math.round(yCursor + (slotH - h)/2);
            ctx.drawImage(img,x,y,w,h); resolve();
          }; img.onerror=reject; img.src=url;
        });
        yCursor += slotH + 40;
      }
      return c;
    }

    function makePdfFromJpegs(pages){
      const enc=new TextEncoder(); const chunks=[]; let offset=0; const NL='\n';
      const pushText=(s)=>{const b=enc.encode(s);chunks.push(b);offset+=b.length}; const pushBytes=(b)=>{chunks.push(b);offset+=b.length};
      pushText('%PDF-1.3'+NL);
      const rootId=1, pagesId=2; let nextId=3; const kids=[]; const objOffsets=[0];
      const writeObj=(id,c)=>{objOffsets[id]=offset; pushText(id+' 0 obj'+NL+c+NL+'endobj'+NL);};
      for(const p of pages){
        const pageId=nextId++, imgId=nextId++, contId=nextId++; kids.push(pageId+' 0 R');
        writeObj(imgId, `<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>`+NL+'stream'+NL);
        pushBytes(p.bytes); pushText(NL+'endstream'+NL);
        const content=`q ${p.w} 0 0 ${p.h} 0 0 cm /Im0 Do Q`; const len=enc.encode(content).length+2;
        writeObj(contId, `<< /Length ${len} >>`+NL+'stream'+NL+content+NL+'endstream');
        writeObj(pageId, `<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${p.w} ${p.h}] /Resources << /XObject << /Im0 ${imgId} 0 R >> >> /Contents ${contId} 0 R >>`);
      }
      writeObj(pagesId, `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`);
      writeObj(rootId, `<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
      const startxref=offset; const count=nextId-1;
      pushText('xref'+NL+'0 '+(count+1)+NL+'0000000000 65535 f '+NL);
      for(let i=1;i<=count;i++){ const off=String(objOffsets[i]||0).padStart(10,'0'); pushText(off+' 00000 n '+NL); }
      pushText('trailer'+NL+`<< /Size ${count+1} /Root ${rootId} 0 R >>`+NL+'startxref'+NL+startxref+NL+'%%EOF');
      let total=0; for(const c of chunks) total+=c.length; const out=new Uint8Array(total); let pos=0; for(const c of chunks){ out.set(c,pos); pos+=c.length; } return out;
    }

    async function canvasesToJpegsSafe(canvases){
      const result=[];
      for(const c of canvases){
        const dataUrl=c.toDataURL('image/jpeg',0.92);
        const b64=dataUrl.split(',')[1]; const bin=atob(b64); const len=bin.length; const u8=new Uint8Array(len); for(let i=0;i<len;i++) u8[i]=bin.charCodeAt(i);
        result.push({bytes:u8, w:c.width, h:c.height});
      }
      return result;
    }

    async function createMultipagePdf(){
      const text=($('#reportFinale').value||'').trim(); if(!text){ showToast(MSG.nothingToPrint); return null; }
      const urls=[state.images[1],state.images[2],state.images[3]].filter(Boolean);
      const canvases=[];
      canvases.push(await renderFirstPage(text, urls[0]||null));
      const second = await renderSecondPage(urls.slice(1));
      if(second) canvases.push(second);
      const pages=await canvasesToJpegsSafe(canvases);
      const pdfBytes=makePdfFromJpegs(pages); return new Blob([pdfBytes],{type:'application/pdf'});
    }

    // Init
    function resetAll(){
      $('#impianto').value=''; $('#data').value=nowDate(); $('#ora').value=nowTime(); $('#operatore').value=''; $('#descrizione').value=''; $('#operazioni').value=''; $('#reportFinale').value='';
      $$('#zoneChips .chip').forEach(b=>b.setAttribute('aria-pressed','false')); $$('#anomaliaChips .chip').forEach(b=>b.setAttribute('aria-checked','false'));
      [1,2,3].forEach(i=>resetImageSlot(i)); updateActionState(); buildReport();
    }
    function init(){
      document.title='Generatore report '+CONFIG.VERSION; $('#versionBadge').textContent='Generatore di report • '+CONFIG.VERSION;
      const sel=$('#impianto'); CONFIG.PLANTS.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });
      // Bind chips
      $('#zoneChips').addEventListener('click', e=>{ const b=e.target.closest('.chip'); if(!b) return; const v=b.getAttribute('aria-pressed')==='true'; b.setAttribute('aria-pressed', String(!v)); buildReport(); });
      $('#anomaliaChips').addEventListener('click', e=>{ const b=e.target.closest('.chip[role="radio"]'); if(!b) return; $$('#anomaliaChips .chip').forEach(x=>x.setAttribute('aria-checked','false')); b.setAttribute('aria-checked','true'); buildReport(); });
      // Inputs
      const onInput=debounce(buildReport,200);
      $('#impianto').addEventListener('change',buildReport); $('#data').addEventListener('change',buildReport); $('#ora').addEventListener('change',buildReport);
      $('#operatore').addEventListener('input',onInput); $('#descrizione').addEventListener('input',onInput); $('#operazioni').addEventListener('input',onInput);
      // Lock textarea
      $('#reportFinale').addEventListener('keydown', e=>e.preventDefault()); $('#reportFinale').addEventListener('paste', e=>e.preventDefault());
      // Image slots
      [1,2,3].forEach(i=>bindImageSlot(i));
      // Buttons
      $('#btnReset').addEventListener('click', ()=>{ resetAll(); });
      $('#btnCopy').addEventListener('click', async ()=>{ const text=$('#reportFinale').value||''; if(!text.trim()) return showToast(MSG.nothingToCopy); if(!navigator.clipboard || !navigator.clipboard.writeText) return showToast('Clipboard API non disponibile.'); try{ await navigator.clipboard.writeText(text); $('#copiedMsg').textContent=MSG.copied; setTimeout(()=>$('#copiedMsg').textContent='',1500); }catch(e){ showToast('Errore copia.'); } });
      $('#btnPrintPdf').addEventListener('click', async ()=>{ try{ const blob=await createMultipagePdf(); if(!blob) return; const url=URL.createObjectURL(blob); const w=window.open(url,'_blank'); if(!w) showToast(MSG.popupBlocked); setTimeout(()=>URL.revokeObjectURL(url),20000); }catch(e){ console.error(e); showToast(MSG.pdfError); } });
      $('#btnDownloadPdf').addEventListener('click', async ()=>{ try{ const blob=await createMultipagePdf(); if(!blob) return; const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='report_guasto.pdf'; document.body.appendChild(a); a.click(); setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);},1000); }catch(e){ console.error(e); showToast(MSG.pdfError); } });
      // Start
      resetAll();
    }
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
