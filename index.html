<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generatore report v5.4.0</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root { --bg:#0b0c10; --panel:#14161c; --ink:#e9eef7; --muted:#aab2bf; --accent:#4e8df5; --line:#2a2e36; }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:920px;margin:28px auto 110px;padding:0 16px}
    h1{margin:0 0 18px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
    .logo{height:90px;width:120px;object-fit:contain}
    .subtitle{color:var(--muted);font-size:.95rem}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .full{grid-column:1 / -1}
    label{display:block;font-weight:700;margin-bottom:6px}
    select,input[type=date],input[type=time],input[type=text],textarea{
      background:#1a1d25;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font:inherit
    }
    textarea{min-height:110px;resize:vertical;white-space:pre-wrap}
    .chips{display:flex;gap:10px;flex-wrap:wrap}
    .chip{border:1px solid var(--line);background:#1a1d25;border-radius:999px;padding:8px 12px;cursor:pointer;font-weight:700}
    .chip[data-on="1"]{background:#223b6f;border-color:#3e6ddc}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
    .btn{background:#1a1d25;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}
    .btn.primary{background:#4e8df5;border-color:#4e8df5;color:#fff}
    .btn.danger{background:#922c2c;border-color:#b03a3a;color:#fff}
    .muted{color:var(--muted);font-size:.9rem}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .slot{border:1px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
    .slot img{display:block;width:100%;aspect-ratio:4/3;object-fit:contain;background:#0e1116;border-radius:6px}
    .slot .row{display:flex;gap:8px}
    .slot input[type=file]{display:none}
    footer{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(20,22,28,0),rgba(20,22,28,1) 40%)}
    .foot{max-width:920px;margin:0 auto;padding:10px 16px 14px;display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted)}
    .badge{border:1px solid var(--line);background:#1a1d25;border-radius:999px;padding:4px 10px;color:#dfe6f2;font-weight:800}
    .print-root{display:none}
    .print-header{text-align:center;margin-bottom:18px}
    .print-header .big-logo{max-width:70%;height:auto;margin:12px auto 6px;display:block}
    .kv{margin-bottom:8px}.kv b{display:inline-block;min-width:140px}
    .section-title{margin:16px 0 6px;font-weight:800}
    .print-gallery{margin-top:12px;display:grid;grid-template-columns:1fr;gap:12px}
    .print-gallery img{width:100%;max-height:20cm;object-fit:contain}
    @media print{
      body{background:#fff;color:#000}
      .wrap,footer{display:none !important}
      .print-root{display:block;padding:1.2cm 1.4cm;font-size:12pt}
      .page-break{break-after:page}
      .waterline{margin-top:12px;text-align:center;color:#333;font-size:10pt}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>
      <img class="logo" src="logo_egp.png" alt="Logo">
      <div>
        <div style="font-weight:900;font-size:1.4rem">Generatore schede guasti</div>
        <div class="subtitle">UT Feltre • OU Quero</div>
      </div>
    </h1>

    <div class="panel">
      <div class="grid">
        <div class="full">
          <label for="impianto">Impianto</label>
          <select id="impianto">
            <option value="" selected>— seleziona impianto —</option>
          </select>
        </div>
        <div>
          <label for="data">Data anomalia</label>
          <input type="date" id="data">
        </div>
        <div>
          <label for="ora">Orario anomalia</label>
          <input type="time" id="ora">
        </div>
        <div>
          <label for="operatore">Operatore</label>
          <input type="text" id="operatore" placeholder="Nome e cognome o sigla">
        </div>
        <div class="full">
          <label>Zona <span class="subtitle">(clic per selezionare/deselezionare)</span></label>
          <div id="zone" class="chips"></div>
        </div>
        <div class="full">
          <label>Anomalia <span class="subtitle">(scelta singola)</span></label>
          <div id="anomalia" class="chips"></div>
        </div>
        <div class="full">
          <label for="descr">Descrizione anomalia</label>
          <textarea id="descr" placeholder="Descrivi l'anomalia riscontrata..."></textarea>
        </div>
        <div class="full">
          <label for="ops">Operazioni effettuate</label>
          <textarea id="ops" placeholder="Indica le azioni svolte, controlli e risultati..."></textarea>
        </div>
        <div class="full">
          <label>Allegati foto (max 3)</label>
          <div class="gallery">
            <div class="slot" data-slot="1">
              <img id="img1" alt="Foto 1" />
              <div class="row">
                <button class="btn" data-up="1" type="button">Carica 1</button>
                <button class="btn danger" data-del="1" type="button">Elimina</button>
                <input type="file" id="file1" accept="image/*">
              </div>
            </div>
            <div class="slot" data-slot="2">
              <img id="img2" alt="Foto 2" />
              <div class="row">
                <button class="btn" data-up="2" type="button">Carica 2</button>
                <button class="btn danger" data-del="2" type="button">Elimina</button>
                <input type="file" id="file2" accept="image/*">
              </div>
            </div>
            <div class="slot" data-slot="3">
              <img id="img3" alt="Foto 3" />
              <div class="row">
                <button class="btn" data-up="3" type="button">Carica 3</button>
                <button class="btn danger" data-del="3" type="button">Elimina</button>
                <input type="file" id="file3" accept="image/*">
              </div>
            </div>
          </div>
        </div>
        <div class="full">
          <label for="out">Report generato (include VERSIONE)</label>
          <textarea id="out" readonly></textarea>
        </div>
        <div class="full actions">
          <button id="copy" class="btn primary" type="button">Copia</button>
          <button id="btnPrint" class="btn" type="button">Stampa</button>
          <button id="btnDownload" class="btn" type="button">Download PDF</button>
          <button id="btnMail" class="btn" type="button">Mail</button>
          <button id="reset" class="btn danger" type="button">Nuovo report</button>
          <span class="muted" id="msg"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="print-root" id="printRoot">
    <div class="print-header">
      <img class="big-logo" src="logo_egp.png" alt="Logo grande">
      <div style="font-size:18pt;font-weight:900">UT Feltre • OU Quero</div>
      <div style="font-size:14pt;font-weight:700">Scheda Guasto</div>
      <div id="verTag" style="margin-top:6px;font-size:11pt;color:#333"></div>
    </div>
    <div class="kv"><b>Impianto:</b> <span id="p_impianto"></span></div>
    <div class="kv"><b>Data:</b> <span id="p_data"></span></div>
    <div class="kv"><b>Ora:</b> <span id="p_ora"></span></div>
    <div class="kv"><b>Operatore:</b> <span id="p_operatore"></span></div>
    <div class="kv"><b>Zona:</b> <span id="p_zona"></span></div>
    <div class="kv"><b>Anomalia:</b> <span id="p_anomalia"></span></div>
    <div class="section-title">Descrizione anomalia</div>
    <div id="p_descr" style="white-space:pre-wrap"></div>
    <div class="section-title">Operazioni effettuate</div>
    <div id="p_ops" style="white-space:pre-wrap"></div>
    <div class="section-title">Allegati</div>
    <div class="print-gallery" id="p_gallery"></div>
    <div class="waterline">Uso interno Enel Green Power • <span id="p_version_footer"></span></div>
    <div class="page-break"></div>
  </div>

  <footer>
    <div class="foot">
      <span class="badge">Generatore di report • v5.4.0</span>
    </div>
  </footer>

  <script>
    const VERSION = "v5.4.0";
    const PLANTS = ["ALTANON","ANZU","ARCADE","BUSCHE DMV","BUSCHE SBARRAMENTO","CAERANO","CASTELVIERO","CROCE DEL GALLO","FONDERIA","PEDEROBBA","POMPE SONNA","PONTE PIETRA","PONTE SAN MARTINO","PRIULA","QUERO","SPEEDY","SPRESIANO","TAVARAN"];
    const ZONE = ["GRUPPO 1","GRUPPO 2","SGRIGLIATORE","ALTRO"];
    const ANOMALIE = ["ALLARME","BLOCCO","ALTRO"];

    const $ = s => document.querySelector(s);
    const el = {
      plant: $("#impianto"), date: $("#data"), time: $("#ora"), oper: $("#operatore"),
      zoneWrap: $("#zone"), anomWrap: $("#anomalia"),
      descr: $("#descr"), ops: $("#ops"),
      out: $("#out"), msg: $("#msg"),
      copy: $("#copy"), btnPrint: $("#btnPrint"), btnDownload: $("#btnDownload"), btnMail: $("#btnMail"), reset: $("#reset"),
      f1: $("#file1"), f2: $("#file2"), f3: $("#file3"),
      i1: $("#img1"), i2: $("#img2"), i3: $("#img3"),
      pImp: $("#p_impianto"), pData: $("#p_data"), pOra: $("#p_ora"), pOper: $("#p_operatore"),
      pZona: $("#p_zona"), pAnom: $("#p_anomalia"),
      pDescr: $("#p_descr"), pOps: $("#p_ops"), pGal: $("#p_gallery"),
      verTag: $("#verTag"), pVerFoot: $("#p_version_footer")
    };

    const state = { zone: new Set(), anomaly: "", imgs: {1:null,2:null,3:null}, lastReportText: "" };

    function initChoices() {
      const frag = document.createDocumentFragment();
      for (const p of PLANTS) {
        const o = document.createElement("option");
        o.value = p; o.textContent = p;
        frag.appendChild(o);
      }
      el.plant.appendChild(frag);

      for (const z of ZONE) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = z; b.dataset.value = z; b.dataset.on = "0";
        b.addEventListener("click", () => {
          const on = b.dataset.on === "1";
          b.dataset.on = on ? "0" : "1";
          if (on) state.zone.delete(z); else state.zone.add(z);
          buildReport();
        });
        el.zoneWrap.appendChild(b);
      }

      for (const a of ANOMALIE) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = a; b.dataset.value = a; b.dataset.on = "0";
        b.addEventListener("click", () => {
          state.anomaly = a;
          [...el.anomWrap.children].forEach(x => x.dataset.on = (x.dataset.value === a ? "1" : "0"));
          buildReport();
        });
        el.anomWrap.appendChild(b);
      }
    }

    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return y + "-" + m + "-" + dd;
    }
    function nowHM() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,"0");
      const mm = String(d.getMinutes()).padStart(2,"0");
      return hh + ":" + mm;
    }
    function dateAsDDMMYYYY(raw) {
      if (!raw || !raw.includes("-")) return "00000000";
      const parts = raw.split("-");
      if (parts.length !== 3) return "00000000";
      const y = parts[0], m = parts[1], d = parts[2];
      return d.padStart(2,"0") + m.padStart(2,"0") + y;
    }

    function buildReport() {
      const plant = el.plant.value || "—";
      const date = el.date.value || "—";
      const time = el.time.value || "—";
      const oper = el.oper.value.trim() || "—";
      const zones = [...state.zone].join(", ") || "—";
      const anom = state.anomaly || "—";
      const desc = el.descr.value.trim() || "—";
      const ops = el.ops.value.trim() || "—";

      const lines = [
        "IMPIANTO: " + plant,
        "DATA: " + date,
        "ORA: " + time,
        "OPERATORE: " + oper,
        "ZONA: " + zones,
        "ANOMALIA: " + anom,
        "",
        "DESCRIZIONE ANOMALIA:",
        desc,
        "",
        "OPERAZIONI EFFETTUATE:",
        ops,
        "",
        "VERSIONE: " + VERSION
      ];
      const text = lines.join("\n");
      state.lastReportText = text;
      el.out.value = text;

      el.verTag.textContent = "Versione " + VERSION;
      el.pVerFoot.textContent = VERSION;
      el.pImp.textContent = plant;
      el.pData.textContent = date;
      el.pOra.textContent = time;
      el.pOper.textContent = oper;
      el.pZona.textContent = zones;
      el.pAnom.textContent = anom;
      el.pDescr.textContent = desc;
      el.pOps.textContent = ops;

      el.pGal.innerHTML = "";
      for (const k of [1,2,3]) {
        const src = state.imgs[k];
        if (src) { const im = document.createElement("img"); im.src = src; el.pGal.appendChild(im); }
      }
    }

    function bindImages(idx) {
      const file = el["f"+idx];
      const img = el["i"+idx];
      const upBtn = document.querySelector('[data-up="'+idx+'"]');
      const delBtn = document.querySelector('[data-del="'+idx+'"]');
      upBtn.addEventListener("click", () => file.click());
      file.addEventListener("change", () => {
        const f = file.files && file.files[0];
        if (!f || !f.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = e => { img.src = e.target.result; state.imgs[idx] = e.target.result; buildReport(); };
        reader.readAsDataURL(f);
      });
      delBtn.addEventListener("click", () => { img.removeAttribute("src"); state.imgs[idx] = null; file.value=""; buildReport(); });
    }

    function copyToClipboard() {
      const t = el.out.value;
      if (!t.trim()) { el.msg.textContent = "Niente da copiare."; return; }
      if (!navigator.clipboard) { el.msg.textContent = "Clipboard non disponibile."; return; }
      navigator.clipboard.writeText(t).then(() => {
        el.msg.textContent = "Copiato.";
        setTimeout(() => el.msg.textContent = "", 1200);
      }).catch(() => { el.msg.textContent = "Errore copia."; });
    }

    function filenameBase() {
      const plant = (el.plant.value || "IMPIANTO").trim() || "IMPIANTO";
      const anom = state.anomaly || "TIPO ALLARME";
      const rawDate = el.date.value || "";
      const datePart = dateAsDDMMYYYY(rawDate);
      const safePlant = plant.replace(/[\/:*?"<>|]/g, " ");
      const safeAnom = anom.replace(/[\/:*?"<>|]/g, " ");
      return safePlant + " - " + safeAnom + " - " + datePart;
    }

    function printPdf() {
      const oldTitle = document.title;
      document.title = filenameBase();
      window.print();
      setTimeout(() => { document.title = oldTitle; }, 2000);
    }

    const A4W = 1654, A4H = 2339, MARGIN = 100;
    const pdfState = { logo: undefined };

    function loadLogo() {
      return new Promise((resolve) => {
        if (pdfState.logo !== undefined) return resolve(pdfState.logo);
        const img = new Image();
        img.onload = () => { pdfState.logo = img; resolve(img); };
        img.onerror = () => { pdfState.logo = null; resolve(null); };
        img.src = "logo_egp.png";
      });
    }

    function wrapText(ctx, text, maxW) {
      const words = String(text||"").split(/\s+/);
      const lines = [];
      let line = "";
      for (const w of words) {
        const test = line ? line + " " + w : w;
        if (ctx.measureText(test).width <= maxW) line = test;
        else { if (line) lines.push(line); line = w; }
      }
      if (line) lines.push(line);
      return lines;
    }

    async function renderPdfPage() {
      const c = document.createElement("canvas");
      c.width = A4W; c.height = A4H;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0,0,A4W,A4H);

      const logo = await loadLogo();
      const left = MARGIN, right = A4W - MARGIN;
      let y = MARGIN;

      if (logo) {
        const maxLogoW = A4W - MARGIN*2;
        const maxLogoH = 280;
        const sc = Math.min(maxLogoW/logo.width, maxLogoH/logo.height);
        const lw = logo.width * sc, lh = logo.height * sc;
        const lx = (A4W - lw)/2;
        const ly = y;
        ctx.drawImage(logo, lx, ly, lw, lh);
        y = ly + lh + 20;
      }

      ctx.fillStyle = "#000";
      ctx.textAlign = "center";
      ctx.font = "bold 40px sans-serif";
      ctx.fillText("UT Feltre • OU Quero", A4W/2, y);
      y += 40;
      ctx.font = "600 30px sans-serif";
      ctx.fillText("Scheda Guasto", A4W/2, y);
      ctx.font = "20px sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(VERSION, A4W - MARGIN, y - 30);

      const maxW = right - left;
      y += 40;

      ctx.textAlign = "left";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText("Impianto:", left, y);
      ctx.font = "24px sans-serif";
      ctx.fillText(el.plant.value || "—", left + 160, y);
      y += 34;

      ctx.font = "bold 26px sans-serif";
      ctx.fillText("Data:", left, y);
      ctx.font = "24px sans-serif";
      ctx.fillText(el.date.value || "—", left + 160, y);
      y += 34;

      ctx.font = "bold 26px sans-serif";
      ctx.fillText("Ora:", left, y);
      ctx.font = "24px sans-serif";
      ctx.fillText(el.time.value || "—", left + 160, y);
      y += 34;

      ctx.font = "bold 26px sans-serif";
      ctx.fillText("Operatore:", left, y);
      ctx.font = "24px sans-serif";
      ctx.fillText(el.oper.value.trim() || "—", left + 160, y);
      y += 34;

      const zones = [...state.zone].join(", ") || "—";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText("Zona:", left, y);
      ctx.font = "24px sans-serif";
      ctx.fillText(zones, left + 160, y);
      y += 34;

      const anom = state.anomaly || "—";
      ctx.font = "bold 26px sans-serif";
      ctx.fillText("Anomalia:", left, y);
      ctx.font = "24px sans-serif";
      ctx.fillText(anom, left + 160, y);
      y += 40;

      ctx.font = "bold 26px sans-serif";
      ctx.fillText("Descrizione anomalia", left, y);
      y += 30;
      ctx.font = "24px sans-serif";
      const descLines = wrapText(ctx, el.descr.value.trim() || "—", maxW);
      for (const line of descLines) {
        if (y > A4H - 520) break;
        ctx.fillText(line, left, y);
        y += 30;
      }

      y += 10;
      ctx.font = "bold 26px sans-serif";
      ctx.fillText("Operazioni effettuate", left, y);
      y += 30;
      ctx.font = "24px sans-serif";
      const opsLines = wrapText(ctx, el.ops.value.trim() || "—", maxW);
      for (const line of opsLines) {
        if (y > A4H - 520) break;
        ctx.fillText(line, left, y);
        y += 30;
      }

      const imgAreaTop = Math.max(y + 20, A4H - 500);
      const imgAreaBottom = A4H - MARGIN - 40;
      const imgAreaH = imgAreaBottom - imgAreaTop;
      const imgAreaW = right - left;
      const urls = [state.imgs[1], state.imgs[2], state.imgs[3]].filter(Boolean);
      if (urls.length > 0 && imgAreaH > 0) {
        const slotH = imgAreaH / urls.length;
        let ySlot = imgAreaTop;
        for (const url of urls) {
          await new Promise((resolve) => {
            const im = new Image();
            im.onload = () => {
              const sc2 = Math.min(imgAreaW/im.width, slotH/im.height);
              const w = im.width * sc2, h = im.height * sc2;
              const x = left + (imgAreaW - w)/2;
              const yy = ySlot + (slotH - h)/2;
              ctx.drawImage(im, x, yy, w, h);
              resolve();
            };
            im.onerror = () => resolve();
            im.src = url;
          });
          ySlot += slotH;
        }
      }

      ctx.font = "18px sans-serif";
      ctx.fillStyle = "#333";
      ctx.textAlign = "center";
      ctx.fillText("Uso interno Enel Green Power • " + VERSION, A4W/2, A4H - MARGIN);

      return c;
    }

    function canvasToJpegPage(canvas) {
      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
      const b64 = dataUrl.split(",")[1];
      const bin = atob(b64);
      const len = bin.length;
      const u8 = new Uint8Array(len);
      for (let i=0;i<len;i++) u8[i] = bin.charCodeAt(i);
      return { bytes: u8, w: canvas.width, h: canvas.height };
    }

    function makePdf(pages) {
      const enc = new TextEncoder();
      const chunks = [];
      let offset = 0;
      const NL = "\n";
      const pushText = s => { const b = enc.encode(s); chunks.push(b); offset += b.length; };
      const pushBytes = b => { chunks.push(b); offset += b.length; };

      pushText("%PDF-1.3"+NL);
      const rootId = 1, pagesId = 2;
      let nextId = 3;
      const kids = [];
      const objOffsets = [0];

      const writeObj = (id, content) => {
        objOffsets[id] = offset;
        pushText(id + " 0 obj"+NL + content + NL + "endobj"+NL);
      };

      for (const p of pages) {
        const pageId = nextId++;
        const imgId = nextId++;
        const contId = nextId++;
        kids.push(pageId + " 0 R");

        writeObj(imgId, `<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>`+NL+"stream"+NL);
        pushBytes(p.bytes);
        pushText(NL+"endstream"+NL);

        const content = `q ${p.w} 0 0 ${p.h} 0 0 cm /Im0 Do Q`;
        const len = enc.encode(content).length + 2;
        writeObj(contId, `<< /Length ${len} >>`+NL+"stream"+NL+content+NL+"endstream");

        writeObj(pageId, `<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${p.w} ${p.h}] /Resources << /XObject << /Im0 ${imgId} 0 R >> >> /Contents ${contId} 0 R >>`);
      }

      writeObj(pagesId, `<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${kids.length} >>`);
      writeObj(rootId, `<< /Type /Catalog /Pages ${pagesId} 0 R >>`);

      const startxref = offset;
      const count = nextId - 1;
      pushText("xref"+NL+"0 "+(count+1)+NL+"0000000000 65535 f "+NL);
      for (let i=1;i<=count;i++) {
        const off = String(objOffsets[i] || 0).padStart(10,"0");
        pushText(off + " 00000 n "+NL);
      }
      pushText("trailer"+NL+`<< /Size ${count+1} /Root ${rootId} 0 R >>`+NL+"startxref"+NL+startxref+NL+"%%EOF");

      let total = 0;
      for (const c of chunks) total += c.length;
      const out = new Uint8Array(total);
      let pos = 0;
      for (const c of chunks) { out.set(c,pos); pos += c.length; }
      return out;
    }

    async function createPdfBlob() {
      const c = await renderPdfPage();
      const page = canvasToJpegPage(c);
      const pdfBytes = makePdf([page]);
      return new Blob([pdfBytes], {type:"application/pdf"});
    }

    async function downloadPdf() {
      try {
        const blob = await createPdfBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filenameBase() + ".pdf";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
      } catch(e) {
        console.error(e);
        el.msg.textContent = "Errore generazione PDF.";
      }
    }

    function sendMail() {
      const plant = (el.plant.value || "IMPIANTO").trim() || "IMPIANTO";
      const anom = state.anomaly || "TIPO ALLARME";
      const time = el.time.value || "ORA";
      const datePart = dateAsDDMMYYYY(el.date.value || "");
      const subj = plant + " - " + anom + " - " + time + " - " + datePart;

      const body = state.lastReportText || "";
      const mailto = "mailto:?subject=" + encodeURIComponent(subj) + "&body=" + encodeURIComponent(body);
      window.location.href = mailto;
    }

    function resetAll() {
      el.plant.value = "";
      el.date.value = todayStr();
      el.time.value = nowHM();
      el.oper.value = "";
      el.descr.value = "";
      el.ops.value = "";
      state.zone = new Set();
      state.anomaly = "";
      for (const k of [1,2,3]) { state.imgs[k]=null; el["i"+k].removeAttribute("src"); el["f"+k].value=""; }
      [...el.zoneWrap.children].forEach(b => b.dataset.on = "0");
      [...el.anomWrap.children].forEach(b => b.dataset.on = "0");
      buildReport();
    }

    function init() {
      initChoices();
      bindImages(1); bindImages(2); bindImages(3);
      el.date.value = todayStr();
      el.time.value = nowHM();
      el.plant.addEventListener("change", buildReport);
      el.date.addEventListener("change", buildReport);
      el.time.addEventListener("change", buildReport);
      el.oper.addEventListener("input", buildReport);
      el.descr.addEventListener("input", buildReport);
      el.ops.addEventListener("input", buildReport);
      el.copy.addEventListener("click", copyToClipboard);
      el.btnPrint.addEventListener("click", printPdf);
      el.btnDownload.addEventListener("click", downloadPdf);
      el.btnMail.addEventListener("click", sendMail);
      el.reset.addEventListener("click", resetAll);
      buildReport();
    }
    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
